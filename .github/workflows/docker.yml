name: Docker

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  image:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Validate docker-compose.yml
      run: docker compose config

    - name: Build the image
      run: |
        docker build \
          --build-arg VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo ci)" \
          -t solistromgateway:ci .

    - name: Report the image size
      run: docker image ls solistromgateway:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

    - name: The image must not run as root
      run: |
        user="$(docker image inspect --format '{{.Config.User}}' solistromgateway:ci)"
        echo "image user: ${user:-<empty, which means root>}"
        test "$user" = "65534:65534"

    - name: The image must contain no shell
      run: |
        # A scratch image has nothing to exec. If this succeeds, something
        # pulled a shell into the final stage.
        if docker run --rm --entrypoint /bin/sh solistromgateway:ci -c true 2>/dev/null; then
          echo "a shell is present in the image, which it should not be"
          exit 1
        fi
        echo "no shell present, as intended"

    - name: The version command must work in the image
      run: |
        # Proves the scratch image can actually execute the static binary.
        docker run --rm solistromgateway:ci version

    - name: The program must run under the locked-down settings
      run: |
        # config.example.json is already checked by the Go tests and covers all
        # three device types, so using it here avoids a second copy of the
        # schema that could drift. None of the addresses in it resolve on a
        # runner, which is exactly what this step wants: the program should
        # start, fail to reach them, and carry on.
        #
        # It is committed world-readable, which the container needs since it
        # runs as uid 65534.
        docker run --detach --name sg-ci \
          --read-only \
          --cap-drop ALL \
          --security-opt no-new-privileges:true \
          --user 65534:65534 \
          --volume "$PWD/config.example.json:/config/config.json:ro" \
          solistromgateway:ci

        # It runs until stopped. The example uses a five second timeout, so wait
        # long enough for the first read to fail and be logged.
        sleep 12
        docker logs sg-ci > /tmp/ci.log 2>&1
        docker stop sg-ci > /dev/null
        docker rm sg-ci > /dev/null
        echo "----- container log -----"
        cat /tmp/ci.log
        echo "-------------------------"

        grep -q 'msg=starting' /tmp/ci.log \
          || { echo "the program did not report starting"; exit 1; }
        grep -qE 'devices=[1-9]' /tmp/ci.log \
          || { echo "the program did not load any devices"; exit 1; }
        grep -q 'could not read device' /tmp/ci.log \
          || { echo "the program did not try to read a device"; exit 1; }

        # On Linux both memory protections apply, and this is the only place
        # that path is exercised: the prctl call has no equivalent on macOS, so
        # it cannot be verified during local development.
        grep -q 'measures=2' /tmp/ci.log \
          || { echo "expected both memory protections to apply on Linux"; exit 1; }
        grep -q 'could not apply a memory protection' /tmp/ci.log \
          && { echo "a memory protection failed inside the container"; exit 1; }
        echo "both memory protections applied under cap_drop ALL"

  publish:
    # Only after the image has been built, run, and checked for a shell and for
    # running as root. Never on a pull request: a fork cannot write packages, and
    # an unreviewed branch should not be published.
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: Work out the image name and tags
      id: meta
      run: |
        # A container repository name has to be lowercase and this owner is not,
        # so the registry would reject the name as written.
        name="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

        short="${GITHUB_SHA::7}"
        tags="--tag ${name}:sha-${short}"
        version="${short}"

        # A tagged release names itself; a build of main is identified by commit.
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          tags="${tags} --tag ${name}:${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME}"
        fi
        if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
          tags="${tags} --tag ${name}:latest"
        fi

        echo "name=${name}" >> "$GITHUB_OUTPUT"
        echo "tags=${tags}" >> "$GITHUB_OUTPUT"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "publishing ${name}, version ${version}, tags:${tags}"

    - name: Sign in to the registry
      run: |
        echo '${{ secrets.GITHUB_TOKEN }}' \
          | docker login ghcr.io --username '${{ github.actor }}' --password-stdin

    - name: Set up a builder that can target other architectures
      # The default driver cannot produce a multi-architecture manifest.
      run: docker buildx create --use --driver docker-container

    - name: Build and publish for all three architectures
      # No emulation is involved. The program is pure Go with cgo disabled, so
      # the build stage runs natively and cross-compiles to each target.
      run: |
        docker buildx build \
          --platform linux/amd64,linux/arm64,linux/arm/v7 \
          --build-arg VERSION="${{ steps.meta.outputs.version }}" \
          ${{ steps.meta.outputs.tags }} \
          --push \
          .

    - name: Confirm the manifest really lists all three architectures
      run: |
        docker buildx imagetools inspect \
          "${{ steps.meta.outputs.name }}:sha-${GITHUB_SHA::7}" | tee /tmp/manifest.txt

        for want in linux/amd64 linux/arm64 linux/arm/v7; do
          grep -q "$want" /tmp/manifest.txt \
            || { echo "the published manifest is missing ${want}"; exit 1; }
        done
        echo "all three architectures are in the published manifest"
